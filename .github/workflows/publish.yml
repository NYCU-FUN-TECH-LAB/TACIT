name: Publish to PyPI

# A published GitHub release builds the package, checks that the built wheel
# installs and runs, and uploads it to PyPI through trusted publishing
# (no API token is stored in the repository).
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: The version matches the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ls dist/ | grep -q "tacit_qda-${tag}-" || { echo "pyproject version does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: The wheel installs and the engines load the shipped frameworks
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import tacit_qda
          import tacit_framework as F
          F.FRAMEWORK_DIR = tacit_qda.bundled_frameworks_dir()
          F.activate_by_id("ri_stilgoe_2013")
          assert F.active().dimensions, "no dimensions loaded"
          print("tacit_qda", tacit_qda.__version__, "->", F.active().name())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
