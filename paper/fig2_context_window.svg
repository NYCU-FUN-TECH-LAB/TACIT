<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- 由 paper/make_fig2.py 產生。數字來自 tacit_llm，不要手改。 -->
  <defs><style>
    .t    { font-family:'DejaVu Sans','Helvetica','Arial',sans-serif; fill:#1a1a1a; }
    .hd   { font-size:26px; font-weight:700; }
    .lab  { font-size:22px; }
    .mos  { font-family:'DejaVu Sans Mono','Courier New',monospace; font-size:22px; }
    .tiny { font-size:21px; fill:#4a4a4a; }
    .note { font-size:23px; fill:#1a1a1a; font-style:italic; }
    .ax   { stroke:#888888; stroke-width:1.6; }
  </style></defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text class="t hd" x="80" y="56">What a 4,096-token window has to hold</text>
  <text class="t tiny" x="80" y="84">Ollama's default. The fixed costs alone exceed it, before any transcript is added.</text>
  <rect x="80" y="104" width="506" height="66" fill="#b4b4b4" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="586" y="104" width="458" height="66" fill="#d6d6d6" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="1044" y="104" width="76" height="66" fill="#ededed" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="691" y1="92" x2="691" y2="200" stroke="#1a1a1a" stroke-width="3.5" stroke-dasharray="9 6"/>
  <text class="t tiny" x="681" y="226" text-anchor="end">window ends: 4,096</text>
  <text class="t lab" x="96" y="144">coding prompt</text>
  <text class="t tiny" x="96" y="196">3,390 tokens</text>
  <text class="t lab" x="707" y="144">output reservation</text>
  <text class="t tiny" x="602" y="196">3,072</text>
  <text class="t tiny" x="1052" y="144">safety</text>
  <text class="t tiny" x="1052" y="196">512</text>
  <text class="t note" x="1120" y="262" text-anchor="end">needed before any transcript: 6,974 tokens, 2,878 more than the window</text>
  <text class="t note" x="1120" y="292" text-anchor="end">— TACIT refuses the prompt; a bare server truncates it silently</text>
  <text class="t hd" x="80" y="350">Longest transcript that fits</text>
  <text class="t tiny" x="80" y="378">Derived from the same formula. Bars are drawn to scale.</text>
  <rect x="500" y="470" width="440" height="252" fill="#f0f0f0"/>
  <line class="ax" x1="500" y1="440" x2="500" y2="722" stroke-dasharray="7 5"/>
  <line class="ax" x1="940" y1="440" x2="940" y2="722" stroke-dasharray="7 5"/>
  <text class="t tiny" x="515" y="424">a one-hour research interview</text>
  <text class="t tiny" x="515" y="448">runs 20,000–60,000 characters</text>
  <text class="t mos" x="80" y="448">num_ctx</text>
  <text class="t mos" x="80" y="504">  4,096</text>
  <text class="t tiny" x="80" y="528">Ollama default</text>
  <line x1="280" y1="484" x2="280" y2="514" stroke="#1a1a1a" stroke-width="3"/>
  <text class="t tiny" x="294" y="506">nothing fits — refused</text>
  <text class="t mos" x="80" y="574">  8,192</text>
  <rect x="280" y="554" width="47" height="30" fill="#b4b4b4" stroke="#1a1a1a" stroke-width="1.8"/>
  <text class="t tiny" x="340" y="576">4,263</text>
  <text class="t mos" x="80" y="644"> 16,384</text>
  <rect x="280" y="624" width="323" height="30" fill="#d6d6d6" stroke="#1a1a1a" stroke-width="1.8"/>
  <text class="t tiny" x="616" y="646">29,351</text>
  <text class="t mos" x="80" y="714"> 32,768</text>
  <text class="t tiny" x="80" y="738">TACIT default</text>
  <rect x="280" y="694" width="796" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <text class="t tiny" x="1089" y="716">72,359</text>
  <line class="ax" x1="280" y1="754" x2="1160" y2="754"/>
  <g class="t tiny" text-anchor="middle">
    <line class="ax" x1="280" y1="754" x2="280" y2="764"/><text x="280" y="788">0</text>
    <line class="ax" x1="500" y1="754" x2="500" y2="764"/><text x="500" y="788">20k</text>
    <line class="ax" x1="720" y1="754" x2="720" y2="764"/><text x="720" y="788">40k</text>
    <line class="ax" x1="940" y1="754" x2="940" y2="764"/><text x="940" y="788">60k</text>
    <line class="ax" x1="1160" y1="754" x2="1160" y2="764"/><text x="1160" y="788">80k</text>
  </g>
</svg>
